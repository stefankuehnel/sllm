version: "3"

tasks:
  default:
    desc: "Run default task"
    cmds:
      - task: "run"

  run:
    desc: "Run project"
    cmds:
      - task: "run:model"

  run:model:
    desc: "Run project with model"
    cmds:
      - |
        curl http://llama-server:8080/v1/chat/completions \
          -H "Content-Type: application/json" \
          -d "${LLAMA_CPP__PAYLOAD}"

    env:
      LLAMA_CPP__PAYLOAD:
        sh: |
          jq \
            -n \
            --arg content "${LLAMA_CPP__PROMPT:-Say hello}" '{ messages: [{ role: "user", content: $content }]}'

  format:
    desc: "Format project"
    cmds:
      - task: "format:nix"

  format:nix:
    desc: "Format project with Nix"
    sources:
      - "**/*.nix"
    cmds:
      - "nix fmt"

  clean:
    desc: "Clean project"
    cmds:
      - task: "clean:task"

  clean:task:
    desc: "Clean project '.task/' directory"
    cmds:
      - "rm --recursive --force .task/"
